name: Deploy Zentinela a Producción

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # clean: false — este runner es self-hosted con disco persistente entre corridas.
      # actions/checkout limpia por defecto (git clean -ffdx), lo que borra node_modules
      # (ignorado por git) en CADA deploy y obliga a un "npm install" 100% desde cero
      # (~20 min: descarga todo el árbol, incluidos binarios nativos pesados de Vite/rolldown).
      # Con clean:false, node_modules persiste entre corridas y npm install solo instala
      # el delta cuando cambia package-lock.json — casi instantáneo si no cambió nada.
      # Es seguro: los archivos versionados igual se resetean al commit desplegado; solo se
      # preservan node_modules/bin/obj (no versionados). Vite regenera dist/ completo en
      # cada build (emptyOutDir), así que no quedan artefactos de build viejos.
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publicar API (folder local, self-contained)
        run: |
          $publish = "$env:GITHUB_WORKSPACE\publish_api"
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }
          dotnet publish src/Zentinela.API/Zentinela.API.csproj `
            -c Release -r win-x64 --self-contained true `
            -o $publish
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Detener App Pool de la API
        run: |
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name "ZentinelaAPI").Value -ne "Stopped") {
            Stop-WebAppPool -Name "ZentinelaAPI"
            Start-Sleep -Seconds 3
          }

      - name: Copiar API a IIS (preserva appsettings.Production.json del servidor)
        run: |
          robocopy "$env:GITHUB_WORKSPACE\publish_api" "C:\inetpub\wwwroot\ZentinelaAPI" /E /XF appsettings.Production.json
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }

      - name: Iniciar App Pool de la API
        if: always()
        run: |
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name "ZentinelaAPI").Value -ne "Started") {
            Start-WebAppPool -Name "ZentinelaAPI"
          }

      # Smoke test: verifica que el API arrancó bien tras el swap de binarios y que
      # conecta a la BD (/health). Si no responde 200 tras reintentos, el deploy FALLA
      # en rojo (en vez de un "success" engañoso) — permite detectar/revertir un deploy
      # roto (binario incompleto, BD inaccesible) antes de que lo sufran los usuarios.
      # NOTA: si el sitio del API no está en :80 con host header 'zentinelaapi', ajustar el --resolve.
      - name: Smoke test API (/health)
        run: |
          $healthy = $false
          for ($i = 1; $i -le 12; $i++) {
            $code = (& curl.exe -s -o NUL -w "%{http_code}" --max-time 10 --resolve zentinelaapi:80:127.0.0.1 http://zentinelaapi/health)
            Write-Host "Intento $i -> HTTP $code"
            if ($code -eq "200") { $healthy = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $healthy) {
            Write-Error "Smoke test FALLIDO: /health no devolvio 200 tras 12 intentos. El deploy quedo roto (binario incompleto o BD inaccesible)."
            exit 1
          }
          Write-Host "Smoke test OK: el API responde y conecta a la BD."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Zentinela.Web/package-lock.json

      # --prefer-offline: usa el cache local de npm en vez de siempre golpear el registry.
      # --no-audit --no-fund: se salta las llamadas de red de auditoría/funding (no afectan
      # las versiones instaladas). No se usa "npm ci" a propósito: npm ci borra node_modules
      # SIEMPRE antes de instalar, lo que anularía el ahorro de clean:false en el checkout.
      - name: Instalar dependencias React
        working-directory: src/Zentinela.Web
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build React
        working-directory: src/Zentinela.Web
        run: npm run build

      - name: Copiar React a IIS
        run: |
          robocopy src\Zentinela.Web\dist C:\inetpub\wwwroot\Zentinela /E /PURGE
          exit 0

      - name: Deploy completado
        run: echo "Zentinela desplegado exitosamente en producción"